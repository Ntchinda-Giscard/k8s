# Grafana — datasources for the LGTM stack in the `lgtm` namespace.
#
#   helm upgrade --install grafana grafana/grafana -n lgtm -f grafana-values.yaml
#
# Grafana lives in `lgtm`, so short service names would resolve, but FQDNs are
# used here so the file still works if Grafana is ever moved.
#
# Mimir now runs in monolithic mode from observability/mimir.yaml. The old note
# here — that Mimir was intentionally absent — applied to the `mimir-distributed`
# chart, whose zone-replicated ingesters and store-gateways cannot satisfy their
# cross-node anti-affinity on one node. Running the binary with `-target=all`
# sidesteps that entirely, the same way Loki runs SingleBinary.
#
# Alloy is the only writer to all three backends; see observability/alloy-values.yaml.

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki-gateway.lgtm.svc.cluster.local:80
        isDefault: true
        jsonData:
          maxLines: 1000

      # Metrics arrive via Alloy → prometheus.remote_write → Mimir. Mimir serves
      # a Prometheus-compatible API under /prometheus, so the datasource type is
      # prometheus, not a Mimir-specific one.
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir.lgtm.svc.cluster.local:9009/prometheus
        isDefault: false
        jsonData:
          timeInterval: 60s # matches Alloy's scrape_interval
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      # ⚠️ Verify the port: `kubectl -n lgtm get svc tempo`. Tempo's own default
      # is 3200, but the grafana/tempo chart configures the server on 3100. A
      # mismatch surfaces only as "Bad Gateway" in Explore.
      #
      # Stays empty until the app is instrumented with OpenTelemetry — tracing
      # currently goes to Sentry (src/main.py:15-23). Alloy's OTLP receiver is
      # already listening on alloy.monitoring.svc.cluster.local:4318.
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.lgtm.svc.cluster.local:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: mimir
          lokiSearch:
            datasourceUid: loki

persistence:
  enabled: true
  size: 2Gi

adminUser: admin
# Read the generated password with:
#   kubectl -n lgtm get secret grafana -o jsonpath="{.data.admin-password}" | base64 -d

service:
  type: ClusterIP

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
