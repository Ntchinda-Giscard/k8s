{{- if .Values.mimir.enabled }}
{{- /*
Mimir in monolithic mode: one process running every component via -target=all.

Resource names are hardcoded to `mimir` rather than release-prefixed, so the
service DNS stays stable no matter what the release is called — the Alloy and
Grafana values reference it by that name and values.yaml cannot be templated.

The ConfigMap lives in mimir-config.yaml, not here — see the note in that file.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: mimir
  labels:
    app: mimir
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  labels:
    app: mimir
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: mimir
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
      annotations:
        # Rolls the pod when the config changes — a ConfigMap edit alone would
        # otherwise leave the old config running until something else restarts it.
        checksum/config: {{ include (print $.Template.BasePath "/mimir-config.yaml") . | sha256sum }}
        # Collected by Alloy's annotation scrape job, so Mimir monitors itself.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9009"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mimir
          image: {{ .Values.mimir.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http
              containerPort: 9009
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mimir.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: storage
              mountPath: /data/mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mimir.persistence.storageClassName }}
        storageClassName: {{ .Values.mimir.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mimir.persistence.size }}
{{- end }}
