{{- if .Values.mimir.enabled }}
{{- /*
Kept in its own file so the StatefulSet in mimir.yaml can hash it with
`include (print $.Template.BasePath "/mimir-config.yaml")`. Putting the
ConfigMap and that annotation in the same template makes the file include
itself, which recurses until Helm aborts.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  labels:
    app: mimir
    {{- include "lgtm-stack.labels" . | nindent 4 }}
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false

    # No egress guarantee on a private 192.168.x network — don't try to phone home.
    usage_stats:
      enabled: false

    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: {{ .Values.mimir.logLevel }}

    # Every ring has exactly one member. An empty join list forms a single-node
    # memberlist cluster, which is what -target=all expects.
    memberlist:
      join_members: []

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist

    ingester:
      ring:
        instance_addr: 127.0.0.1
        replication_factor: 1
        kvstore:
          store: memberlist

    store_gateway:
      sharding_ring:
        replication_factor: 1
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist

    compactor:
      data_dir: /data/mimir/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/blocks
      bucket_store:
        sync_dir: /data/mimir/tsdb-sync
      tsdb:
        dir: /data/mimir/tsdb

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/ruler

    # Defaults to ./metrics-activity.log, which is not writable here.
    activity_tracker:
      filepath: /data/mimir/metrics-activity.log

    limits:
      compactor_blocks_retention_period: {{ .Values.mimir.retention }}
      max_global_series_per_user: {{ .Values.mimir.limits.maxGlobalSeriesPerUser }}
      ingestion_rate: {{ .Values.mimir.limits.ingestionRate }}
      ingestion_burst_size: {{ .Values.mimir.limits.ingestionBurstSize }}
      out_of_order_time_window: 5m
{{- end }}
