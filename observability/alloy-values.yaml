# Grafana Alloy — collects container stdout from every pod and ships it to Loki.
# (Replaces Promtail, which is end-of-life.)
#
#   helm upgrade --install alloy grafana/alloy \
#     -n monitoring --create-namespace -f alloy-values.yaml
#
# Log lines are forwarded raw and parsed at query time with `| json` in LogQL —
# WazaLink emits JSON to stdout, other pods do not, so parsing here would fail
# on everything else in the cluster.

controller:
  type: daemonset

alloy:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.lgtm.svc.cluster.local:80/loki/api/v1/push"
        }
      }
